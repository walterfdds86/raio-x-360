<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raio-X Empresarial 360 — Diagnóstico Estratégico</title>
  <meta name="description" content="Revele onde o crescimento da sua empresa está travando. 25 perguntas, 5 dimensões, resultado imediato.">
  <meta property="og:title" content="Raio-X Empresarial 360 — Diagnóstico Estratégico">
  <meta property="og:description" content="Revele onde o crescimento da sua empresa está travando. 25 perguntas, 5 dimensões, resultado imediato.">
  <meta property="og:url" content="https://raio-x-360.vercel.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark:    #0d1117;
      --bg-card:    #161b22;
      --text-white: #ffffff;
      --text-dark:  #1a1a2e;
      --accent:     #f5c518;
      --accent-dim: #e6b800;
      --muted:      #8b949e;
      --border:     #30363d;
      --green:      #2ea043;
      --red:        #f85149;
      --blue:       #58a6ff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .screen { display: none; }
    .screen.active { display: block; }
    .accent { color: var(--accent); }

    /* BOTÕES */
    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-align: center;
    }
    .btn-primary:hover  { background: var(--accent-dim); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
    }
    @keyframes btnPulse {
      0%   { box-shadow: 0 0 0 0 rgba(245,197,24,0.55); }
      60%  { box-shadow: 0 0 0 10px rgba(245,197,24,0); }
      100% { box-shadow: 0 0 0 0 rgba(245,197,24,0); }
    }
    .btn-pulse { animation: btnPulse 0.7s ease 2; }
    .btn-secondary {
      display: inline-block;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { color: var(--text-white); border-color: var(--muted); }

    /* TRANSIÇÕES DE TELA */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .screen.active { animation: fadeSlideIn 0.3s ease forwards; }

    /* SLIDE DE PERGUNTA */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(28px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .slide-right { animation: slideInRight 0.22s ease forwards; }
    .slide-left  { animation: slideInLeft  0.22s ease forwards; }

    /* BOUNCE DO RATING */
    @keyframes ratingPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.28); }
      100% { transform: scale(1); }
    }
    .rating-pop { animation: ratingPop 0.22s ease forwards; }

    /* INPUT DE NOME */
    .name-label {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .name-input {
      width: 100%;
      max-width: 300px;
      padding: 13px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    .name-input:focus { border-color: var(--accent); }
    .name-input::placeholder { color: var(--border); }

    /* RATING BUTTONS */
    .rating-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }
    .rating-btn:hover:not(.selected) {
      border-color: var(--muted);
      color: var(--text-white);
    }
    .rating-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text-dark);
    }
    @media (max-width: 400px) {
      .rating-btn { width: 50px; height: 50px; font-size: 1.05rem; }
      .container { padding: 20px 16px; }
    }

    /* DOTS DE PROGRESSO */
    .q-dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, transform 0.2s;
      background: var(--border);
    }
    .q-dot.answered { background: var(--accent); }
    .q-dot.current  { background: var(--text-white); transform: scale(1.3); }
    .q-dot:hover    { transform: scale(1.2); }

    /* MICRO-FEEDBACK */
    .micro-feedback {
      display: none;
      margin-top: 14px;
      padding: 9px 13px;
      background: rgba(245, 197, 24, 0.07);
      border-left: 3px solid var(--accent);
      border-radius: 0 5px 5px 0;
      font-size: 0.83rem;
      color: var(--accent);
      font-weight: 600;
      line-height: 1.45;
    }

    /* TELA DE TRANSIÇÃO */
    #screen-transition .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 55vh;
      text-align: center;
    }
    .transition-checkmark {
      width: 68px; height: 68px;
      background: rgba(245,197,24,0.1);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      margin-bottom: 24px;
    }
    @keyframes popIn {
      0%  { transform: scale(0.4); opacity: 0; }
      65% { transform: scale(1.18); }
      100%{ transform: scale(1); opacity: 1; }
    }
    .transition-checkmark { animation: popIn 0.38s ease forwards; }

    /* RESULTADO — SEÇÃO */
    .result-section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 44px 0 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* CARDS DO RESULTADO — hover */
    .result-dim-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      transition: border-color 0.2s, transform 0.2s;
      cursor: default;
    }
    .result-dim-card:hover {
      border-color: var(--muted);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- TELA 1: INTRO -->
  <div id="screen-intro" class="screen active">
    <div class="container" style="text-align:center; padding-top: 80px;">
      <p style="color: var(--accent); font-weight: 700; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;">DIAGNÓSTICO ESTRATÉGICO</p>
      <h1 style="font-size: 2.4rem; font-weight: 800; line-height: 1.2; margin-bottom: 20px;">
        Raio-X Empresarial <span class="accent">360</span>
      </h1>
      <p style="color: var(--muted); font-size: 1.05rem; max-width: 460px; margin: 0 auto 16px; line-height: 1.65;">
        Descubra com clareza onde o crescimento da sua empresa está travando — e quais áreas precisam ser estruturadas para você escalar.
      </p>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 44px;">
        ⏱ 3 minutos &nbsp;·&nbsp; 25 perguntas &nbsp;·&nbsp; 5 dimensões
      </p>
      <div style="margin-bottom: 20px;">
        <label for="input-name" class="name-label">Como posso te chamar?</label>
        <input
          id="input-name"
          type="text"
          class="name-input"
          placeholder="Seu primeiro nome"
          maxlength="40"
          onkeydown="if(event.key==='Enter') startDiagnostic()"
        >
      </div>
      <button class="btn-primary" onclick="startDiagnostic()" style="font-size: 1.1rem; padding: 16px 48px; margin-top: 4px;">
        Iniciar Diagnóstico
      </button>
      <div id="saved-result-banner"></div>
    </div>
  </div>

  <!-- TELA 2: DIMENSÃO -->
  <div id="screen-dimension" class="screen">
    <!-- Header sticky -->
    <div style="background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 14px 20px; position: sticky; top: 0; z-index: 10;">
      <div style="max-width: 640px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span id="dim-counter" style="color: var(--muted); font-size: 0.82rem; font-weight: 600;"></span>
          <span id="dim-score-preview" style="color: var(--accent); font-size: 0.82rem; font-weight: 600;"></span>
        </div>
        <div style="background: var(--border); border-radius: 4px; height: 4px;">
          <div id="progress-bar" style="background: var(--accent); height: 4px; border-radius: 4px; width: 0%; transition: width 0.4s ease;"></div>
        </div>
      </div>
    </div>

    <div class="container">
      <p id="dim-measures" style="color: var(--accent); font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;"></p>
      <h2 id="dim-title" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 6px;"></h2>
      <p id="dim-description" style="color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.55;"></p>

      <!-- Dots de progresso (clicáveis) -->
      <div id="question-dots" style="display: flex; gap: 8px; margin-bottom: 28px; align-items: center;"></div>

      <!-- Pergunta única (animada) -->
      <div id="questions-container"></div>

      <!-- Botão avançar -->
      <div style="margin-top: 32px;">
        <button id="btn-next" class="btn-primary" type="button" onclick="nextDimension()" disabled></button>
      </div>
    </div>
  </div>

  <!-- TELA TRANSIÇÃO -->
  <div id="screen-transition" class="screen">
    <div class="container">
      <div class="transition-checkmark">✓</div>
      <div id="transition-msg" style="font-size: 1.4rem; font-weight: 800; line-height: 1.5; max-width: 360px;"></div>
      <p style="color: var(--muted); font-size: 0.88rem; margin-top: 10px;">Carregando próxima dimensão…</p>
    </div>
  </div>

  <!-- TELA 3: RESULTADO -->
  <div id="screen-result" class="screen">
    <div style="background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 14px 20px;">
      <div style="max-width: 640px; margin: 0 auto;">
        <div style="background: var(--border); border-radius: 4px; height: 4px;">
          <div style="background: var(--accent); height: 4px; border-radius: 4px; width: 100%;"></div>
        </div>
      </div>
    </div>
    <div class="container">
      <div id="result-content"></div>
    </div>
  </div>

  <script>
    // ── DADOS ──────────────────────────────────────────────────────────────────
    const DIMENSIONS = [
      {
        id: 'modelo',
        title: '1. Modelo de Negócio',
        measures: 'Clareza de oferta · Escalabilidade · Sustentabilidade',
        description: 'Avalie a clareza, posicionamento e sustentabilidade do seu modelo de negócio.',
        questions: [
          'Seu modelo de negócio é claramente definido e compreendido por toda a liderança?',
          'Sua empresa possui uma oferta principal clara e bem posicionada?',
          'Seu modelo permite crescimento sem aumento proporcional de esforço operacional?',
          'Sua margem de lucro permite investimento em crescimento?',
          'Existe previsibilidade de receita?'
        ]
      },
      {
        id: 'crescimento',
        title: '2. Estrutura de Crescimento',
        measures: 'Organização estrutural · Direção estratégica · Capacidade de escalar',
        description: 'Avalie se a empresa tem estrutura, processos e direção para crescer de forma consistente.',
        questions: [
          'Sua empresa possui processos estruturados para crescimento?',
          'Existem metas claras e acompanhadas regularmente?',
          'O crescimento da empresa é planejado (e não acontece de forma reativa)?',
          'Existe uma estrutura organizacional clara?',
          'Você tem clareza sobre quais são as principais alavancas de crescimento do negócio?'
        ]
      },
      {
        id: 'comercial',
        title: '3. Comercial e Receita',
        measures: 'Previsibilidade comercial · Maturidade de vendas · Estabilidade de receita',
        description: 'Avalie a maturidade do processo comercial e a estabilidade das suas fontes de receita.',
        questions: [
          'Existe um processo de vendas definido?',
          'O fluxo de leads é previsível?',
          'Sua equipe comercial possui metas e indicadores claros?',
          'O processo de conversão é mensurado?',
          'Seu faturamento não depende excessivamente de poucos clientes?'
        ]
      },
      {
        id: 'lideranca',
        title: '4. Liderança e Time',
        measures: 'Dependência do fundador · Maturidade da liderança · Delegação',
        description: 'Avalie a autonomia da liderança e a independência operacional do negócio.',
        questions: [
          'As decisões estratégicas estão distribuídas (não concentradas apenas no fundador)?',
          'Sua liderança possui autonomia real?',
          'Os papéis dentro da empresa estão claramente definidos?',
          'Existe um processo estruturado de reunião de liderança?',
          'Sua empresa conseguiria funcionar bem por uma semana sem você?'
        ]
      },
      {
        id: 'cultura',
        title: '5. Cultura e Execução',
        measures: 'Cultura organizacional · Execução estratégica · Alinhamento interno',
        description: 'Avalie o alinhamento cultural, a consistência de execução e a capacidade de aprendizado.',
        questions: [
          'Os valores da empresa são claros e vividos no dia a dia?',
          'Existe alinhamento sobre prioridades estratégicas?',
          'As decisões são executadas com consistência?',
          'Existe cultura de responsabilidade e entrega?',
          'A empresa aprende com erros e ajusta rapidamente?'
        ]
      }
    ];

    const FAIXAS = [
      { min: 0,   max: 40,  emoji: '🔴', title: 'Negócio Dependente do Fundador', description: 'A empresa ainda depende muito da ação direta do fundador e possui baixa estrutura de crescimento.', priority: 'Prioridade: organização básica e definição de modelo.', color: 'var(--red)' },
      { min: 41,  max: 80,  emoji: '🟡', title: 'Negócio em Estruturação',         description: 'Existem elementos de crescimento, mas a estrutura ainda não sustenta escala.',                        priority: 'Prioridade: organizar processos e liderança.',        color: 'var(--accent)' },
      { min: 81,  max: 110, emoji: '🟢', title: 'Negócio em Expansão',             description: 'A empresa possui bases sólidas, mas ainda precisa aprimorar estrutura para crescer de forma consistente.', priority: 'Prioridade: refinar modelo e comercial.',             color: 'var(--green)' },
      { min: 111, max: 125, emoji: '🔵', title: 'Negócio Estruturado para Escala', description: 'A empresa possui estrutura forte e pode focar em expansão estratégica.',                                priority: 'Prioridade: alavancas de crescimento.',              color: 'var(--blue)' }
    ];

    const MAX_SCORE = DIMENSIONS.reduce((sum, d) => sum + d.questions.length * 5, 0);

    const INSIGHTS = {
      modelo: [
        { max: 12, text: 'Seu modelo ainda não está claramente definido. O primeiro passo é documentar sua oferta principal e entender sua margem real de lucro.' },
        { max: 19, text: 'Você tem a base do modelo, mas falta previsibilidade de receita e clareza sobre escalabilidade. Refine o posicionamento da oferta.' },
        { max: 25, text: 'Modelo sólido e bem posicionado. Foque em aumentar a previsibilidade de receita e expandir canais de aquisição.' }
      ],
      crescimento: [
        { max: 12, text: 'A empresa ainda cresce de forma reativa. Estruturar metas e processos é o primeiro passo para sair do modo "apagando incêndios".' },
        { max: 19, text: 'Há estrutura, mas sem consistência. Defina um ritmo de reuniões de acompanhamento e métricas claras por área.' },
        { max: 25, text: 'Boa estrutura de crescimento. O próximo nível é identificar e ativar sistematicamente suas principais alavancas de escala.' }
      ],
      comercial: [
        { max: 12, text: 'Sem processo comercial definido, a receita depende do acaso. Documente o funil de vendas e defina KPIs básicos de conversão.' },
        { max: 19, text: 'O processo existe mas não é previsível. Trabalhe na consistência do fluxo de leads e na mensuração da taxa de conversão.' },
        { max: 25, text: 'Comercial bem estruturado. Invista em reduzir a dependência de poucos clientes e ampliar os canais de aquisição.' }
      ],
      lideranca: [
        { max: 12, text: 'A empresa depende excessivamente de você. Comece delegando decisões operacionais para liberar seu tempo para o estratégico.' },
        { max: 19, text: 'A liderança tem autonomia parcial. Defina papéis com mais clareza e implemente reuniões de liderança com pauta estruturada.' },
        { max: 25, text: 'Time autônomo e bem estruturado. Invista no desenvolvimento da liderança de segundo nível para sustentar o crescimento.' }
      ],
      cultura: [
        { max: 12, text: 'A cultura não está formalizada e a execução é inconsistente. Comece definindo valores reais e rituais simples de responsabilidade.' },
        { max: 19, text: 'Há alinhamento parcial, mas a execução ainda falha. Crie rituais de acompanhamento e fortaleça a cultura de entrega.' },
        { max: 25, text: 'Cultura sólida com boa execução. Mantenha os rituais e acelere o ciclo de aprendizado com revisões regulares.' }
      ]
    };

    function getPersonalizedClosing(name, faixa, lowest) {
      const dim = lowest.title.replace(/^\d+\.\s*/, '');
      const map = {
        'var(--red)':    `${name}, o diagnóstico revelou o que mais trava empresas no seu estágio: o negócio gira em torno de você. Bruno Capanema construiu 5 empresas operando em mais de 60 países — e a primeira coisa que ele fez foi criar estrutura para o negócio funcionar sem depender diretamente dele. No Desafio, você vai aprender como montar essa estrutura: máquina comercial, delegação real de decisões e saída do operacional para o estratégico.`,
        'var(--accent)': `${name}, você sente que trabalha muito e o resultado não acompanha o esforço. Esse é o sinal clássico de uma empresa em estruturação — tem base, mas ainda falta uma máquina que escale sozinha. Bruno Capanema dedicou anos a entender como transformar esse esforço em crescimento previsível. No Desafio, você vai aplicar o mesmo método que ele usou para construir um grupo com 5 empresas atuando em mais de 60 países.`,
        'var(--green)':  `${name}, você está à frente — e o diagnóstico confirma. Empresas no seu estágio não travam por falta de esforço, travam por falta de precisão nas alavancas certas, especialmente em <strong style="color:var(--text-white);">${dim}</strong>. Bruno Capanema passou pelo mesmo ponto e foi o que ativou para levar o Grupo Dádiva de uma empresa para cinco, em mais de 60 países. No Desafio, ele vai te mostrar exatamente quais parafusos apertar.`,
        'var(--blue)':   `${name}, você construiu algo que poucos empresários conseguem — e o diagnóstico confirma. O próximo movimento é ativar as alavancas de crescimento que ainda não foram exploradas e escalar com consistência. É exatamente o que Bruno Capanema fez ao estruturar o Grupo Dádiva para operar com 5 empresas em mais de 60 países. O Desafio é onde esse próximo nível começa.`
      };
      return map[faixa.color] || map['var(--accent)'];
    }

    function buildGapCallout(dimScores) {
      const sorted = [...dimScores].sort((a, b) => (a.score / a.max) - (b.score / b.max));
      const gaps = sorted.filter(d => (d.score / d.max) < 0.65);
      const toShow = gaps.length > 0 ? gaps : sorted.slice(0, 2);

      const items = toShow.map(d => {
        const pct = Math.round((d.score / d.max) * 100);
        const dimName = d.title.replace(/^\d+\.\s*/, '');
        const isGap = (d.score / d.max) < 0.65;
        const iconColor = isGap ? 'var(--red)' : 'var(--accent)';
        const icon = isGap ? '⚠️' : '🔧';
        const label = isGap ? 'Gap identificado' : 'Área de melhoria';
        return `
          <div style="display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);">
            <span style="font-size:1.1rem;margin-top:1px;">${icon}</span>
            <div style="flex:1;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <span style="font-weight:700;font-size:0.93rem;">${dimName}</span>
                <span style="color:${iconColor};font-size:0.75rem;font-weight:700;background:rgba(0,0,0,0.3);padding:2px 7px;border-radius:20px;border:1px solid ${iconColor};opacity:0.85;">${label}</span>
              </div>
              <div style="background:var(--border);border-radius:4px;height:3px;margin-top:6px;">
                <div style="background:${iconColor};height:3px;border-radius:4px;width:${pct}%;"></div>
              </div>
              <p style="color:var(--muted);font-size:0.8rem;margin-top:7px;line-height:1.5;">${getInsight(d.id, d.score).split('.')[0]}.</p>
            </div>
          </div>
        `;
      }).join('');

      const n = toShow.length;
      const label = gaps.length > 0
        ? `O diagnóstico identificou <strong style="color:var(--text-white);">${n} gap${n > 1 ? 's prioritários' : ' prioritário'}</strong> no seu negócio:`
        : `O diagnóstico identificou as <strong style="color:var(--text-white);">${n} principais áreas de melhoria</strong> do seu negócio:`;

      return `
        <p style="color:var(--muted);font-size:0.93rem;margin-bottom:4px;">${label}</p>
        <div>${items}</div>
        <div style="margin-top:18px;padding:14px 16px;background:rgba(245,197,24,0.06);border-radius:8px;border-left:3px solid var(--accent);">
          <p style="color:var(--accent);font-weight:700;font-size:0.9rem;line-height:1.5;">
            ✅ Todos esses pontos serão trabalhados no Desafio de 5 Dias — com um plano de ação específico para o seu estágio.
          </p>
        </div>
      `;
    }

    function getInsight(dimId, score) {
      const list = INSIGHTS[dimId] || [];
      return (list.find(i => score <= i.max) || list[list.length - 1])?.text || '';
    }

    // ── MICRO-FEEDBACK ────────────────────────────────────────────────────────
    const MICRO_FEEDBACKS = [
      '💡 Esse é exatamente o tipo de gap que o desafio de 5 dias resolve.',
      '🎯 Esse ponto é uma das principais alavancas que vamos trabalhar no desafio.',
      '🔑 Identificar isso é o primeiro passo. No desafio você vai saber exatamente como corrigir.',
      '⚡ Boa honestidade. Esse gap tem solução — e o desafio mostra o caminho.',
      '🧩 Esse é um dos padrões mais comuns em empresas em estruturação. Vamos resolver isso juntos.'
    ];
    let _feedbackIdx = 0;
    function nextFeedback() {
      return MICRO_FEEDBACKS[_feedbackIdx++ % MICRO_FEEDBACKS.length];
    }

    // ── TRANSIÇÕES ────────────────────────────────────────────────────────────
    const TRANSITIONS = [
      'Primeira dimensão concluída! Agora: <span class="accent">Estrutura de Crescimento</span>.',
      'Ótimo ritmo! Agora: <span class="accent">Comercial e Receita</span>.',
      'Você está na metade! Agora: <span class="accent">Liderança e Time</span>.',
      'Quase lá! Última dimensão: <span class="accent">Cultura e Execução</span>.'
    ];

    // ── ESTADO ────────────────────────────────────────────────────────────────
    let currentDimIndex = 0;
    let currentQuestionIndex = 0;
    let answers = {};
    let userName = '';
    let _autoAdvanceTimer = null;

    // ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function startDiagnostic() {
      const input = document.getElementById('input-name');
      userName = (input?.value || '').trim();
      if (!userName) {
        input.focus();
        input.style.borderColor = 'var(--red)';
        setTimeout(() => { input.style.borderColor = 'var(--border)'; }, 1500);
        return;
      }
      currentDimIndex = 0;
      currentQuestionIndex = 0;
      answers = {};
      renderDimension();
      showScreen('screen-dimension');
    }

    // ── RENDERIZAR DIMENSÃO ───────────────────────────────────────────────────
    function renderDimension() {
      const dim = DIMENSIONS[currentDimIndex];
      currentQuestionIndex = 0;

      document.getElementById('dim-counter').textContent = `Dimensão ${currentDimIndex + 1} de ${DIMENSIONS.length}`;
      document.getElementById('dim-score-preview').textContent = '';
      document.getElementById('progress-bar').style.width = `${((currentDimIndex + 1) / DIMENSIONS.length) * 100}%`;
      document.getElementById('dim-measures').textContent = dim.measures;
      document.getElementById('dim-title').textContent = dim.title;
      document.getElementById('dim-description').textContent = dim.description;

      const btnNext = document.getElementById('btn-next');
      btnNext.textContent = currentDimIndex === DIMENSIONS.length - 1 ? 'Ver resultado →' : 'Próxima dimensão →';
      btnNext.disabled = true;

      renderQuestion('right');
    }

    // ── RENDERIZAR PERGUNTA ÚNICA ─────────────────────────────────────────────
    function renderQuestion(direction) {
      const dim = DIMENSIONS[currentDimIndex];
      const qi = currentQuestionIndex;
      const key = `${dim.id}-${qi}`;
      const saved = answers[key];
      const showFeedback = saved !== undefined && saved <= 2;

      const container = document.getElementById('questions-container');
      container.innerHTML = `
        <div class="${direction === 'right' ? 'slide-right' : 'slide-left'}">
          <div style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 18px;">
            <span style="font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1;">${qi + 1}</span>
            <span style="color: var(--muted); font-size: 0.9rem; font-weight: 600;">/ ${dim.questions.length}</span>
          </div>
          <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 22px;">
            <p style="font-size: 1.05rem; font-weight: 600; margin-bottom: 26px; line-height: 1.65;">${dim.questions[qi]}</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
              ${[1,2,3,4,5].map(v => `
                <button
                  type="button"
                  class="rating-btn${saved === v ? ' selected' : ''}"
                  data-key="${key}"
                  data-value="${v}"
                  onclick="selectRating('${key}', ${v})"
                >${v}</button>
              `).join('')}
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0 4px; margin-bottom: 2px;">
              <span style="color: var(--muted); font-size: 0.7rem;">Discordo totalmente</span>
              <span style="color: var(--muted); font-size: 0.7rem;">Concordo totalmente</span>
            </div>
            <div id="feedback-${key}" class="micro-feedback" style="display: ${showFeedback ? 'block' : 'none'};">
              ${showFeedback ? MICRO_FEEDBACKS[_feedbackIdx % MICRO_FEEDBACKS.length] : ''}
            </div>
          </div>
        </div>
      `;

      updateDots();
      updateNextButton();
    }

    // ── NAVEGAR ENTRE PERGUNTAS ───────────────────────────────────────────────
    function goToQuestion(qi) {
      if (qi < 0 || qi >= DIMENSIONS[currentDimIndex].questions.length) return;
      const direction = qi >= currentQuestionIndex ? 'right' : 'left';
      currentQuestionIndex = qi;
      renderQuestion(direction);
    }

    // ── SELECIONAR NOTA ───────────────────────────────────────────────────────
    function selectRating(key, value) {
      answers[key] = value;

      // Atualizar visual dos botões + bounce
      document.querySelectorAll(`[data-key="${key}"]`).forEach(btn => {
        const v = parseInt(btn.dataset.value);
        btn.classList.toggle('selected', v === value);
        if (v === value) {
          btn.classList.remove('rating-pop');
          void btn.offsetWidth; // reflow para reiniciar animação
          btn.classList.add('rating-pop');
          btn.addEventListener('animationend', () => btn.classList.remove('rating-pop'), { once: true });
        }
      });

      // Micro-feedback para notas baixas
      const feedback = document.getElementById(`feedback-${key}`);
      if (feedback) {
        if (value <= 2) {
          if (!feedback.textContent.trim()) feedback.textContent = nextFeedback();
          feedback.style.display = 'block';
        } else {
          feedback.style.display = 'none';
        }
      }

      updateDots();
      updateNextButton();

      // Auto-avançar para próxima pergunta
      // Cancela timer anterior antes de criar novo (evita avanços duplos ao trocar resposta)
      if (_autoAdvanceTimer) { clearTimeout(_autoAdvanceTimer); _autoAdvanceTimer = null; }

      const dim = DIMENSIONS[currentDimIndex];
      const nextQi = currentQuestionIndex + 1;
      if (nextQi < dim.questions.length) {
        // Notas baixas: aguarda mais para o usuário ler o micro-feedback
        const delay = value <= 2 ? 2200 : 360;
        _autoAdvanceTimer = setTimeout(() => {
          _autoAdvanceTimer = null;
          currentQuestionIndex = nextQi;
          renderQuestion('right');
        }, delay);
      } else {
        // Última pergunta da dimensão: pulsar botão e rolar até ele
        const btnNext = document.getElementById('btn-next');
        if (btnNext && !btnNext.disabled) {
          btnNext.classList.remove('btn-pulse');
          void btnNext.offsetWidth; // reflow para reiniciar animação
          btnNext.classList.add('btn-pulse');
          btnNext.addEventListener('animationend', () => btnNext.classList.remove('btn-pulse'), { once: true });
          setTimeout(() => btnNext.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
        }
      }
    }

    // ── DOTS ──────────────────────────────────────────────────────────────────
    function updateDots() {
      const dim = DIMENSIONS[currentDimIndex];
      const dotsEl = document.getElementById('question-dots');
      if (!dotsEl) return;
      dotsEl.innerHTML = dim.questions.map((_, qi) => {
        const answered = answers[`${dim.id}-${qi}`] !== undefined;
        const isCurrent = qi === currentQuestionIndex;
        const cls = isCurrent ? 'q-dot current' : answered ? 'q-dot answered' : 'q-dot';
        return `<button type="button" class="${cls}" onclick="goToQuestion(${qi})" title="Pergunta ${qi + 1}"></button>`;
      }).join('');
    }

    // ── BOTÃO PRÓXIMO ─────────────────────────────────────────────────────────
    function updateNextButton() {
      const dim = DIMENSIONS[currentDimIndex];
      const allAnswered = dim.questions.every((_, qi) => answers[`${dim.id}-${qi}`] !== undefined);
      document.getElementById('btn-next').disabled = !allAnswered;
      if (allAnswered) {
        const s = getDimensionScore(dim.id, dim.questions.length);
        document.getElementById('dim-score-preview').textContent = `${s}/${dim.questions.length * 5} pts`;
      }
    }

    function getDimensionScore(dimId, n) {
      let t = 0;
      for (let i = 0; i < n; i++) t += answers[`${dimId}-${i}`] || 0;
      return t;
    }

    // ── PRÓXIMA DIMENSÃO ──────────────────────────────────────────────────────
    function nextDimension() {
      const nextIndex = currentDimIndex + 1;
      if (nextIndex < DIMENSIONS.length) {
        const transMsg = document.getElementById('transition-msg');
        if (transMsg) transMsg.innerHTML = TRANSITIONS[currentDimIndex] || '';
        showScreen('screen-transition');
        setTimeout(() => {
          currentDimIndex = nextIndex;
          renderDimension();
          showScreen('screen-dimension');
        }, 1000);
      } else {
        currentDimIndex = nextIndex;
        showResult();
      }
    }

    // ── ANIMAÇÕES ─────────────────────────────────────────────────────────────
    function animateCount(el, from, to, duration) {
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function drawRadarChart(canvasId, dimScores) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width, cx = size / 2, cy = size / 2;
      const R = size * 0.33, labelR = size * 0.44;
      const n = dimScores.length, step = (Math.PI * 2) / n, startAngle = -Math.PI / 2;
      ctx.clearRect(0, 0, size, size);

      [0.25, 0.5, 0.75, 1].forEach(scale => {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const a = startAngle + i * step;
          i === 0 ? ctx.moveTo(cx + Math.cos(a) * R * scale, cy + Math.sin(a) * R * scale)
                  : ctx.lineTo(cx + Math.cos(a) * R * scale, cy + Math.sin(a) * R * scale);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(48,54,61,0.9)'; ctx.lineWidth = 1; ctx.stroke();
      });

      for (let i = 0; i < n; i++) {
        const a = startAngle + i * step;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
        ctx.strokeStyle = 'rgba(48,54,61,0.9)'; ctx.lineWidth = 1; ctx.stroke();
      }

      ctx.beginPath();
      dimScores.forEach((d, i) => {
        const pct = Math.min(d.score / d.max, 1), a = startAngle + i * step;
        i === 0 ? ctx.moveTo(cx + Math.cos(a) * R * pct, cy + Math.sin(a) * R * pct)
                : ctx.lineTo(cx + Math.cos(a) * R * pct, cy + Math.sin(a) * R * pct);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(245,197,24,0.12)'; ctx.fill();
      ctx.strokeStyle = '#f5c518'; ctx.lineWidth = 2.5; ctx.stroke();

      dimScores.forEach((d, i) => {
        const pct = Math.min(d.score / d.max, 1), a = startAngle + i * step;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * R * pct, cy + Math.sin(a) * R * pct, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#f5c518'; ctx.fill();
      });

      const labels = dimScores.map(d => d.title.replace(/^\d+\.\s*/, '').split(' ')[0]);
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillStyle = '#8b949e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      dimScores.forEach((_, i) => {
        const a = startAngle + i * step;
        ctx.fillText(labels[i], cx + Math.cos(a) * labelR, cy + Math.sin(a) * labelR);
      });
    }

            <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;"><span style="color:var(--accent);font-size:0.85rem;font-weight:700;min-width:20px;margin-top:2px;">D5</span><span style="font-size:0.88rem;color:var(--muted);"><strong style="color:var(--text-white);">Cultura e Execução</strong> — alinhamento interno, consistência de entrega e ciclo de aprendizado</span></div>
          </div>
          <p style="color: var(--muted); font-size: 0.83rem; margin-bottom: 16px;">O desafio começa em:</p>
          <div id="countdown" style="display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; min-height: 70px;"></div>
          <p style="color: var(--muted); font-size: 0.76rem; letter-spacing: 1px;">4 a 8 de maio</p>
        </div>

        <!-- AÇÕES -->
        <div style="text-align: center; padding: 32px 0 60px; display: flex; flex-direction: column; gap: 14px; align-items: center;">
          <a href="https://brunocapanema.com/desafio-5-alavancas"
             target="_blank"
             rel="noopener noreferrer"
             style="display:inline-block;background:linear-gradient(135deg,#f5c518 0%,#fdd835 55%,#e6a800 100%);color:#07090e;font-family:'Inter',sans-serif;font-weight:800;font-size:1.05rem;padding:16px 32px;border-radius:10px;text-decoration:none;transition:box-shadow 0.2s,transform 0.15s;box-shadow:0 4px 24px rgba(245,197,24,0.35);"
             onmouseover="this.style.boxShadow='0 8px 36px rgba(245,197,24,0.5)';this.style.transform='translateY(-2px)'"
             onmouseout="this.style.boxShadow='0 4px 24px rgba(245,197,24,0.35)';this.style.transform='translateY(0)'"
             onmousedown="this.style.transform='scale(0.98)'"
             onmouseup="this.style.transform='translateY(-2px)'">
            Quero participar do Desafio →
          </a>
        </div>
      `;

      showScreen('screen-result');

      // Score count-up
      const scoreEl = document.getElementById('score-total');
      if (scoreEl) animateCount(scoreEl, 0, total, 1200);

      // Barras + radar
      setTimeout(() => {
        document.querySelectorAll('[data-animate-bar]').forEach(bar => {
          bar.style.width = bar.dataset.animateBar;
        });
        drawRadarChart('radar-chart', dimScores);
      }, 120);

      // Countdown só quando o bloco ficar visível (não distrai leitura)
      initCountdown();

      // Salvar no localStorage
      try {
        localStorage.setItem('raio-x-360', JSON.stringify({ answers, total, userName, timestamp: Date.now() }));
      } catch(_) {}
    }

    function restartDiagnostic() {
      currentDimIndex = 0;
      currentQuestionIndex = 0;
      answers = {};
      userName = '';
      document.getElementById('result-content').innerHTML = '';
      try { localStorage.removeItem('raio-x-360'); } catch(_) {}
      showScreen('screen-intro');
    }

    // ── COUNTDOWN (IntersectionObserver — só ativa quando visível) ────────────
    function startCountdown() {
      const el = document.getElementById('countdown');
      if (!el) return;
      const target = new Date('2026-05-04T00:00:00');
      function render() {
        const diff = target - new Date();
        if (diff <= 0) {
          el.innerHTML = '<p style="color:var(--accent);font-weight:800;font-size:1.1rem;">🎯 O desafio começa hoje!</p>';
          return;
        }
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins  = Math.floor((diff % 3600000) / 60000);
        const secs  = Math.floor((diff % 60000) / 1000);
        el.innerHTML = [{ v: days, l: 'dias' }, { v: hours, l: 'horas' }, { v: mins, l: 'min' }, { v: secs, l: 'seg' }]
          .map(({ v, l }) => `
            <div style="text-align:center;">
              <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-width:56px;">
                <span style="font-size:1.65rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;">${String(v).padStart(2,'0')}</span>
              </div>
              <span style="color:var(--muted);font-size:0.68rem;margin-top:4px;display:block;">${l}</span>
            </div>`).join('');
        if (window._countdownTimer) clearTimeout(window._countdownTimer);
        window._countdownTimer = setTimeout(render, 1000);
      }
      render();
    }

    function initCountdown() {
      const el = document.getElementById('countdown');
      if (!el) return;
      if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) { startCountdown(); obs.disconnect(); }
        }, { threshold: 0.4 });
        obs.observe(el);
      } else {
        setTimeout(startCountdown, 2500);
      }
    }

    // ── ATALHOS DE TECLADO ────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      const v = parseInt(e.key);
      if (v >= 1 && v <= 5 && document.getElementById('screen-dimension').classList.contains('active')) {
        const dim = DIMENSIONS[currentDimIndex];
        const key = `${dim.id}-${currentQuestionIndex}`;
        if (answers[key] === undefined) selectRating(key, v);
      }
    });

    // ── RESTAURAR RESULTADO SALVO ─────────────────────────────────────────────
    function restoreSavedResult() {
      try {
        const saved = JSON.parse(localStorage.getItem('raio-x-360'));
        if (!saved?.answers) return;
        answers = saved.answers;
        userName = saved.userName || '';
        currentDimIndex = DIMENSIONS.length;
        showResult();
      } catch(_) {}
    }

    (function checkSavedResult() {
      try {
        const saved = JSON.parse(localStorage.getItem('raio-x-360'));
        if (!saved?.answers || !saved.timestamp) return;
        if (Date.now() - saved.timestamp > 7 * 24 * 3600 * 1000) { localStorage.removeItem('raio-x-360'); return; }
        const banner = document.getElementById('saved-result-banner');
        if (!banner) return;
        const name = saved.userName ? `, ${saved.userName}` : '';
        banner.innerHTML = `
          <div style="margin-top:24px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;max-width:360px;margin-left:auto;margin-right:auto;">
            <p style="color:var(--muted);font-size:0.85rem;margin-bottom:10px;">Você já realizou este diagnóstico${name}. Deseja ver seu resultado anterior?</p>
            <button class="btn-secondary" onclick="restoreSavedResult()" style="font-size:0.85rem;">Ver resultado anterior →</button>
          </div>`;
      } catch(_) {}
    })();
  </script>
</body>
</html>
